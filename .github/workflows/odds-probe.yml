name: Odds probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - env:
          PROPLINE_KEY: ${{ secrets.PROPLINE_KEY }}
        run: python scripts/probe/link_probe.py
