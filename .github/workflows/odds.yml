name: Sportsbook odds

on:
  workflow_dispatch:
    inputs:
      sports:
        description: "Sports to pull"
        required: true
        default: "nhl nba nfl soccer"

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull odds
        env:
          PROPLINE_KEY: ${{ secrets.PROPLINE_KEY }}
          SPORTS: ${{ inputs.sports }}
        run: for s in $SPORTS; do python scripts/odds.py "$s"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add */odds.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Sportsbook odds"
          git pull --rebase -X theirs
          git push
