name: Soccer probe
on:
  push:
    branches: ["probe/soccer"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FotMob check
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p probe/fotmob && cd probe/fotmob
          get(){ code=$(curl -s -H "Accept: application/json" -o "$2" -w "%{http_code}" "$1"); echo "$code $(head -c 120 "$2" | tr -d '\n') <- $1" | tee -a status.txt; }
          rm -f *.json *.html status.txt upcoming.txt
          for id in 47 48 108 132 133 87 140 138 55 86 141 54 146 209 53 110 134 57 61 40 71 64 135 38 69 46 59 67 130 230 268 112 536 223 113 42 73 10216 9806 45 299 297 10611 9841 10199 9808 9807; do
            curl -sL "https://www.fotmob.com/leagues/$id/overview/x" -o l.html
            python3 - $id <<'PY' >> leagues.txt
          import re,json,sys
          try:
              h=open("l.html").read()
              d=json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S).group(1))["props"]["pageProps"]
              det=d.get("details",{})
              print(sys.argv[1], det.get("name"), det.get("country"), det.get("selectedSeason"), len(d.get("allAvailableSeasons",[])))
          except Exception as e:
              print(sys.argv[1], "ERR", e)
          PY
            sleep 1
          done
          rm -f l.html
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "FotMob probe [skip ci]" && git push
