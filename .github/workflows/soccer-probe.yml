name: Soccer probe
on:
  push:
    branches: ["probe/soccer"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FotMob check
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p probe/fotmob && cd probe/fotmob
          get(){ code=$(curl -s -H "Accept: application/json" -o "$2" -w "%{http_code}" "$1"); echo "$code $(head -c 120 "$2" | tr -d '\n') <- $1" | tee -a status.txt; }
          get https://www.fotmob.com/robots.txt robots.txt
          get "https://www.fotmob.com/api/data/matches?date=20261108" matches_data.json
          get "https://www.fotmob.com/api/matches?date=20261108" matches.json
          get "https://www.fotmob.com/api/data/leagues?id=47" league_data.json
          get "https://www.fotmob.com/api/leagues?id=47" league.json
          mid=$(jq -r '[.leagues[]?.matches[]?][0].id // empty' matches_data.json matches.json 2>/dev/null | head -1)
          echo "match $mid" | tee -a status.txt
          [ -n "$mid" ] && get "https://www.fotmob.com/api/data/matchDetails?matchId=$mid" md_data.json
          [ -n "$mid" ] && get "https://www.fotmob.com/api/matchDetails?matchId=$mid" md.json
          get "https://www.fotmob.com/en/leagues/47/overview/premier-league" page.html
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "FotMob probe [skip ci]" && git push
