name: Soccer probe
on:
  push:
    branches: ["probe/soccer"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FotMob check
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p probe/fotmob && cd probe/fotmob
          get(){ code=$(curl -s -H "Accept: application/json" -o "$2" -w "%{http_code}" "$1"); echo "$code $(head -c 120 "$2" | tr -d '\n') <- $1" | tee -a status.txt; }
          rm -f *.json *.html status.txt
          get(){ code=$(curl -sL -o "$2" -w "%{http_code} %{url_effective}" "$1"); echo "$code <- $1" | tee -a status.txt; }
          get "https://www.fotmob.com/leagues/47/fixtures/premier-league" league.html
          get "https://www.fotmob.com/leagues/47/fixtures/premier-league?season=2025-2026" league_prev.html
          python3 - <<'PY' > upcoming.txt
          import re,json
          h=open("league.html").read()
          d=json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S).group(1))["props"]["pageProps"]
          ms=d["fixtures"]["allMatches"]
          up=[m for m in ms if not m["status"].get("finished")]
          print(up[0]["id"])
          PY
          get "https://www.fotmob.com/match/$(cat upcoming.txt)" upcoming.html
          for f in league.html league_prev.html upcoming.html; do
            python3 - "$f" <<'PY' | tee -a status.txt
          import re,json,sys
          h=open(sys.argv[1]).read()
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S)
          if not m: print(sys.argv[1],"no next data"); sys.exit()
          d=json.loads(m.group(1))["props"]["pageProps"]
          print(sys.argv[1], list(d.keys())[:25])
          json.dump(d, open(sys.argv[1]+".json","w"))
          PY
          done
          rm -f *.html
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "FotMob probe [skip ci]" && git push
