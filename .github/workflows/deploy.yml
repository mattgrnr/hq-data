name: Deploy

on:
  push:
    branches: [main, "preview/**"]
    paths: ["sites/*/worker.js", "sites/*/wrangler.toml"]
  workflow_dispatch:
    inputs:
      site:
        description: "Folder to deploy (moonshot, touchdown, total, slapshot)"
        required: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Find changed sites
        id: sites
        run: |
          if [ -n "${{ inputs.site }}" ]; then
            echo "list=${{ inputs.site }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            before=$(git merge-base origin/main HEAD)
          fi
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            list=$(ls -d sites/*/ | cut -d/ -f2 | while read d; do [ -f "sites/$d/wrangler.toml" ] && echo "$d"; done | tr '\n' ' ')
          else
            list=$(git diff --name-only "$before" HEAD | grep -E '^sites/[a-z]+/(worker\.js|wrangler\.toml)$' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Deploy or preview
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret"
            exit 1
          fi
          alias=$(echo "${GITHUB_REF_NAME#preview/}" | tr -c 'a-z0-9\n' '-' | cut -c1-30)
          for site in ${{ steps.sites.outputs.list }}; do
            echo "::group::$site"
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              npx --yes wrangler@4 deploy --config "sites/$site/wrangler.toml"
              echo "- **$site** deployed" >> "$GITHUB_STEP_SUMMARY"
            else
              npx --yes wrangler@4 versions upload --config "sites/$site/wrangler.toml" --preview-alias "$alias" | tee out.txt
              url=$(grep -oE 'https://[^ ]+workers\.dev[^ ]*' out.txt | tail -1)
              echo "- **$site** preview: $url" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
