name: Soccer board

on:
  schedule:
    - cron: "23 * * * *"   # hourly: fill in match history, refresh lineups and the slate
  workflow_dispatch:
    inputs:
      budget:
        description: "Minutes to spend fetching"
        default: "40"

permissions:
  contents: write

concurrency:
  group: soccer-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build board
        env:
          BUDGET_MIN: ${{ inputs.budget || '40' }}
        run: python scripts/build_soccer.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soccer/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Soccer board update"
          git pull --rebase -X theirs
          git push
