name: NBA board

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 8:17 AM Central: last night's games are in
    - cron: "47 21 * * *"   # daily, 4:47 PM Central: rosters and injury news before tip-off
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyarrow
        run: pip install pyarrow

      - name: Build board
        run: python scripts/build_nba.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "NBA board update"
          git pull --rebase -X theirs
          git push
