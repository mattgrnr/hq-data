name: NBA board

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 8:17 AM Central: last night's games are in
    - cron: "47 21 * * *"   # daily, 4:47 PM Central: rosters and injury news before tip-off
    - cron: "37 15 * * *"   # backups: GitHub sometimes delays or skips a scheduled run
    - cron: "37 18 * * *"
    - cron: "37 23 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild past picks from the board's git history"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nba-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: ${{ inputs.backfill && '0' || '1' }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyarrow
        run: pip install pyarrow

      - name: Build board
        run: TODAY=$(TZ=America/Chicago date +%F) python scripts/build_nba.py && (python scripts/odds.py nba || true) && python scripts/build_games.py nba    # today in Central time, like every page
        env:
          PROPLINE_KEY: ${{ secrets.PROPLINE_KEY }}

      - name: Build tomorrow's board
        continue-on-error: true
        run: |
          TODAY=$(TZ=America/Chicago date -d tomorrow +%F) BOARD_OUT=nba/board-tomorrow.json python scripts/build_nba.py
          python scripts/build_games.py nba nba/board-tomorrow.json

      - name: Best bets for Total HQ
        continue-on-error: true
        run: node scripts/best.cjs slam nba/board.json nba/best.json

      - name: Save picks for games that haven't started
        run: node scripts/history/score.cjs slam nba/board.json nba/history/picks

      - name: Grade finished games
        run: python scripts/history/grade.py nba ${{ inputs.backfill && '--backfill' || '' }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "NBA board update"
          # another board can save in the gap: fetch its work and try again (each board only touches its own folder)
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            echo "save collided with another build; retrying ($i)"
            sleep $((i * 5))
          done
          exit 1
