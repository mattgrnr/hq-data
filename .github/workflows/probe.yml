name: probe
on: { push: { branches: [preview/socscores], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env: { PROPLINE_KEY: "${{ secrets.PROPLINE_KEY }}" }
        run: |
          python3 - <<'PY'
          import sys, json; sys.path.insert(0, "scripts")
          import odds
          for sp in ["soccer_uefa_champions_league", "basketball_nba", "icehockey_nhl", "hockey_nhl", "football_nfl"]:
              try: d = odds.get(f"sports/{sp}/scores", daysFrom="1")
              except Exception as e: print("SP", sp, "ERR", str(e)[:100]); continue
              d = d if isinstance(d, list) else []
              hot = [x for x in d if x.get("live") or x.get("status") not in ("upcoming", None)]
              print("SP", sp, len(d), "not upcoming:", len(hot), sorted({x.get("status") for x in d}))
              for x in hot[:4]: print("  G", x.get("home_team"), x.get("home_score"), "-", x.get("away_score"), x.get("away_team"), "|", x.get("status"), x.get("live"), x.get("period"), x.get("clock"), x.get("commence_time"), x.get("last_update") or x.get("updated_at"))
          PY
