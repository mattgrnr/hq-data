name: probe
on: { push: { branches: [preview/fav], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pyarrow
      - env: { PROPLINE_KEY: "${{ secrets.PROPLINE_KEY }}" }
        run: |
          python scripts/odds.py soccer && python scripts/build_games.py soccer
          python3 -c "
          import json; d=json.load(open('soccer/board.json'))
          for g in d['games']:
              if 'Napoli' in g['a']: print('MANCITY', g['h'], 'v', g['a'], 'book' if g['proj'].get('book') else 'NO BOOK', len(g['proj'].get('value',[])))
          print('with book', sum(1 for g in d['games'] if (g.get('proj') or {}).get('book')), '/', len(d['games']))"
