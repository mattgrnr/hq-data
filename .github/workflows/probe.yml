name: probe
on: { push: { branches: [preview/goals], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env: { PROPLINE_KEY: "${{ secrets.PROPLINE_KEY }}" }
        run: |
          python3 - <<'PY'
          import sys, collections; sys.path.insert(0, "scripts")
          import odds
          C = {"icehockey_nhl": ["player_goals","player_goals_alternate","player_goal_scorer_anytime","player_2plus_goals","player_goals_2plus"],
               "soccer_epl": ["anytime_goal_scorer","player_goals","player_to_score_2_or_more","player_goals_2plus","player_2plus_goals","player_score_2_or_more","player_goals_alternate","player_to_score_two_or_more"]}
          for sp, mks in C.items():
              evs = odds.get(f"sports/{sp}/events") or []
              evs = evs if isinstance(evs, list) else (evs.get("events") or evs.get("data") or [])
              if not evs: print("SP", sp, "no events"); continue
              ev = evs[min(2, len(evs)-1)]["id"]; print("SP", sp, len(evs), "events")
              for mk in mks:
                  d = odds.get(f"sports/{sp}/events/{ev}/odds", markets=mk) or {}
                  names = collections.defaultdict(set)
                  for b in d.get("bookmakers") or []:
                      if b.get("key") not in odds.BOOKS: continue
                      for m in b.get("markets") or []:
                          for o in m.get("outcomes") or []:
                              names[(o.get("name"), o.get("point"))].add(odds.BOOKS[b["key"]])
                  print("  MK %-30s" % mk, sorted(((k, ",".join(sorted(v))) for k, v in names.items()), key=str)[:6] or "-")
          PY
