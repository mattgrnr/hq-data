name: probe
on: { push: { branches: [preview/slipttl], paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pyarrow
      - env: { PROPLINE_KEY: "${{ secrets.PROPLINE_KEY }}" }
        run: |
          python scripts/odds.py nhl && python scripts/build_games.py nhl
          python3 -c "
          import json; d=json.load(open('nhl/board.json'))
          for n in ('connor mcdavid','leon draisaitl','jack eichel'):
              for r in d['props'].get(n,{}).get('P',[]): print('PTS', n, r[0], '+', sorted(r[6]))
          import collections; c=collections.Counter(len(r[6]) for v in d['props'].values() for r in v.get('P',[]) if r[0]==2)
          print('PTS 2+ books per player', sorted(c.items()))"
