name: Preview data

# preview branches only: rebuild boards with the branch's builders into preview-data/
on:
  push:
    branches: ["preview/**"]
    paths: ["preview-data/build.txt"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install pyarrow
      - name: Build boards
        env:
          PROPLINE_KEY: ${{ secrets.PROPLINE_KEY }}
        run: |
          python scripts/build_nhl.py && (python scripts/odds.py nhl || true) && python scripts/build_games.py nhl
          python scripts/build_soccer.py && (python scripts/odds.py soccer || true) && python scripts/build_games.py soccer
          for x in "nhl slapshot" "soccer futbol"; do set -- $x
            cp $1/board.json preview-data/$1/board.json
            node scripts/best.cjs $2 $1/board.json preview-data/$1/best.json || true
          done
          python3 -c "import json;d=json.load(open('soccer/board.json'));print('Osimhen listed:', any('Osimhen' in p['n'] for p in d['players']))"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-data/
          git diff --cached --quiet && exit 0
          git commit -m "Preview data"
          git push || (git pull --rebase --autostash -X theirs && git push)
