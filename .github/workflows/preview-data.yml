name: Preview data

# preview branches only: rebuild boards with the branch's builders into preview-data/
on:
  push:
    branches: ["preview/**"]
    paths: ["preview-data/build.txt"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install pyarrow
      - name: Build boards
        env:
          PROPLINE_KEY: ${{ secrets.PROPLINE_KEY }}
        run: |
          python3 - <<'PY'
          import sys, json; sys.path.insert(0, "scripts")
          import build_soccer as B, odds
          d = B.page("/leagues/42/fixtures/x")
          ms = [m for m in d["fixtures"]["allMatches"] if (m.get("status") or {}).get("finished")][:3]
          for m in ms: print("score check:", m["home"].get("name"), B.score_of(m), m["away"].get("name"), {k: m["home"].get(k) for k in ("score",)}, m["status"].get("scoreStr"))
          for mk in ("draw_no_bet", "double_chance"):
              r = odds.get("sports/soccer_uefa_champions_league/odds", markets=mk)
              evs = r if isinstance(r, list) else (r or {}).get("events") or []
              print(mk, "books:", sorted({b.get("key") for e in evs for b in e.get("bookmakers") or [] for m in b.get("markets") or [] if m.get("outcomes")}))
          PY
          python scripts/build_soccer.py && python scripts/odds.py soccer && python scripts/build_games.py soccer
          cp soccer/board.json preview-data/soccer/board.json
          node scripts/best.cjs futbol soccer/board.json preview-data/soccer/best.json || true
          python3 - <<'PY'
          import json, glob
          d = json.load(open("soccer/board.json"))
          b = [g["proj"].get("book", {}) for g in d["games"] if g.get("proj")]
          print("games with dnb/dc/handicap/total:", sum("dnb" in x for x in b), sum("dc" in x for x in b), sum("ah" in x for x in b), sum("over" in x for x in b))
          print("players with SOT/shots prices:", sum("T" in v for v in d["props"].values()), sum("S" in v for v in d["props"].values()))
          print("fixtures with scores:", sum(1 for f in glob.glob("soccer/fixtures/*.json") for ms in json.load(open(f))["matches"].values() for m in ms if m.get("sc")))
          print("lines saved:", sorted(glob.glob("soccer/history/lines/*.json")))
          for g in d["games"]:
              for v in g["proj"].get("value", []):
                  print("  value", g["h"], "|", v["mk"], v["side"], v["ours"], v["book"], v["price"])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-data/
          git diff --cached --quiet && exit 0
          git commit -m "Preview data"
          git push || (git pull --rebase --autostash -X theirs && git push)
