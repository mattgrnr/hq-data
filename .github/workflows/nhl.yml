name: NHL board

on:
  schedule:
    - cron: "17 12 * * *"   # daily, 7:17 AM Central: last night's games are in
    - cron: "17 16 * * *"   # daily, 11:17 AM Central: catch a late data update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyarrow
        run: pip install pyarrow

      - name: Build board
        run: python scripts/build_nhl.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhl/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "NHL board update"
          git pull --rebase -X theirs
          git push
