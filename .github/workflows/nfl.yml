name: NFL board

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 6:17 AM Central: overnight stats and rosters
    - cron: "17 21 * * *"   # daily, 4:17 PM Central: afternoon injury reports
    - cron: "7 16 * * 0"    # Sunday, 11:07 AM Central: last changes before kickoff
    - cron: "37 14 * * *"   # backups: GitHub sometimes delays or skips a scheduled run
    - cron: "37 19 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild past picks from the board's git history"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nfl-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: ${{ inputs.backfill && '0' || '1' }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build board
        run: python scripts/build_nfl.py && (python scripts/odds.py nfl || true) && python scripts/build_games.py nfl
        env:
          PROPLINE_KEY: ${{ secrets.PROPLINE_KEY }}

      - name: Save picks for games that haven't started
        run: node scripts/history/score.cjs touchdown nfl/board.json nfl/history/picks

      - name: Grade finished games
        run: python scripts/history/grade.py nfl ${{ inputs.backfill && '--backfill' || '' }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "NFL board update"
          git pull --rebase -X theirs
          git push
