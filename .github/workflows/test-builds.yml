name: Test builds
on:
  push:
    branches: ["preview/allsites"]
    paths: ["scripts/build_*.py", ".github/workflows/test-builds.yml"]
permissions:
  contents: write
concurrency:
  group: test-builds
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyarrow
      - name: Build NHL, NBA and NFL boards from this branch
        run: |
          python scripts/build_nhl.py
          python scripts/build_nba.py
          python scripts/build_nfl.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhl nba nfl
          git commit -qm "Test boards [skip ci]" && git push || echo "no changes"
