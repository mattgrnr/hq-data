name: Track probe
on:
  push:
    branches: ["preview/hub"]
    paths: [".github/track-probe.json"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          curl -s -X POST -H "Referer: https://hub-total-hq.wehttam30.workers.dev/" -H "Content-Type: application/json" --data @.github/track-probe.json https://hub-total-hq.wehttam30.workers.dev/track
          echo
          curl -s -H "Referer: https://hub-total-hq.wehttam30.workers.dev/" https://hub-total-hq.wehttam30.workers.dev/best | head -c 400
