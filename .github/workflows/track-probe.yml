name: Track probe
on:
  push:
    branches: ["preview/hub"]
    paths: [".github/track-probe.txt"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o b.json -w "%{http_code} %{redirect_url}\n" "https://api-web.nhle.com/v1/gamecenter/2026020383/boxscore"
          python3 -c "import json; d=json.load(open('b.json')); s=d.get('playerByGameStats',{}); print(list(d.keys())[:30]); print(list(s.keys())); a=s.get('awayTeam',{}); print(list(a.keys())); print(json.dumps((a.get('forwards') or [{}])[0])[:500])"
          curl -s -H "Referer: https://slapshot-hq.com/" "https://slapshot-hq.com/live?d=2026-11-23" | python3 -c "import json,sys; d=json.load(sys.stdin); print(list(d.keys()), len(d.get('players') or {}))"
