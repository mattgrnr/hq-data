name = "slapshot-hq"
main = "worker.js"
compatibility_date = "2026-10-22"
workers_dev = false
preview_urls = true
keep_vars = true

[[routes]]
pattern = "slapshot-hq.com"
custom_domain = true

[[routes]]
pattern = "www.slapshot-hq.com"
custom_domain = true

# accounts: sign-in, sessions and visit counts (scripts/auth)
[[d1_databases]]
binding = "ACCOUNTS"
database_name = "hq-accounts"
database_id = "0e4fb67e-8386-4745-ba92-ef1baedb7f20"
