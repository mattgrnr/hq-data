name = "futbol-hq"
main = "worker.js"
compatibility_date = "2026-11-15"
workers_dev = false
preview_urls = true

[[routes]]
pattern = "futbol-hq.com"
custom_domain = true

[[routes]]
pattern = "www.futbol-hq.com"
custom_domain = true

[[routes]]
pattern = "soccer-hq.com"
custom_domain = true

[[routes]]
pattern = "www.soccer-hq.com"
custom_domain = true

# accounts: sign-in, sessions and visit counts (scripts/auth)
[[d1_databases]]
binding = "ACCOUNTS"
database_name = "hq-accounts"
database_id = "0e4fb67e-8386-4745-ba92-ef1baedb7f20"

# every page needs a signed-in account (scripts/auth)
[vars]
GATE = "on"
