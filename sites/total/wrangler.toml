name = "total-hq"
main = "worker.js"
compatibility_date = "2026-08-16"
# domains for existing sites stay managed in the dashboard
workers_dev = false
preview_urls = true
keep_vars = true

# shared betslips (total-hq.com/p/<id>), kept two weeks
[[kv_namespaces]]
binding = "SLIPS"
id = "8c34921c4f624543815f310ecf29dd12"

# every 10 minutes: start any board build that's due (GitHub's own scheduler skips runs)
[triggers]
crons = ["*/10 * * * *"]
